name: Build Valved

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar ASIO SDK da Steinberg
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip
          Expand-Archive asiosdk.zip -DestinationPath asiosdk_tmp -Force
          $h = Get-ChildItem asiosdk_tmp -Recurse -Filter iasiodrv.h | Select-Object -First 1
          if ($h) {
            $dir = $h.Directory.FullName -replace '\\', '/'
            "ASIO_SDK_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DASIO_SDK_DIR="${{ env.ASIO_SDK_DIR }}"

      - name: Compilar
        run: cmake --build build --config Release --parallel 4

      - name: Empacotar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/Valved_artefacts/Release/VST3/Valved.vst3" dist/
          Copy-Item "build/Valved_artefacts/Release/Standalone/Valved.exe" dist/
          Compress-Archive -Path dist/* -DestinationPath Valved-Windows.zip
          New-Item -ItemType Directory -Force -Path distlink | Out-Null
          Copy-Item -Recurse "build/ValvedCamLink_artefacts/Release/VST3/Valved Cam Link.vst3" distlink/
          Compress-Archive -Path distlink/* -DestinationPath ValvedCamLink-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Valved-Windows
          path: |
            Valved-Windows.zip
            ValvedCamLink-Windows.zip

  macos:
    if: false   # Mac fora por enquanto (só Windows + Android)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Configurar (Universal: Apple Silicon + Intel)"
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          -DVLV_BUILD_RENDER=ON

      - name: Compilar (AU, VST3, Standalone e ferramenta de teste)
        run: cmake --build build --config Release --parallel 4 --target Valved_AU Valved_VST3 Valved_Standalone ValvedRender

      - name: Assinar (ad-hoc)
        run: |
          A=build/Valved_artefacts/Release
          ls -R $A | head -40
          for b in "$A/AU/Valved.component" "$A/VST3/Valved.vst3" "$A/Standalone/Valved.app"; do
            codesign --force --deep --sign - "$b"
            lipo -info "$(find "$b/Contents/MacOS" -type f | head -1)"
          done

      - name: Testar o som (gravação de guitarra pelos 15 presets, Apple Silicon e Intel)
        run: |
          gunzip -c Tests/audio/guitar_di_48k.f32.gz > di.f32
          R=$(find build -name ValvedRender -type f -perm -u+x | head -1)
          echo "== Apple Silicon =="
          "$R" di.f32 renders_arm64
          echo "== Intel (Rosetta) =="
          arch -x86_64 "$R" di.f32 renders_x86_64 || echo "Rosetta indisponível no runner"
          ditto -c -k --keepParent renders_arm64 Valved-macOS-teste.zip

      - name: Validar o Audio Unit (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Valved_artefacts/Release/AU/Valved.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i valved || true
          auval -strict -v aufx Vld1 Rbzb | tail -40

      - name: Empacotar
        run: |
          A=build/Valved_artefacts/Release
          mkdir -p dist
          cp -R "$A/AU/Valved.component" "$A/VST3/Valved.vst3" "$A/Standalone/Valved.app" dist/
          {
            echo "VALVED para macOS (Apple Silicon e Intel)"
            echo ""
            echo "Instalacao:"
            echo "1) Valved.component -> /Library/Audio/Plug-Ins/Components   (Logic, GarageBand e outros que usam AU)"
            echo "2) Valved.vst3      -> /Library/Audio/Plug-Ins/VST3         (Reaper, Cubase, Studio One, Ableton...)"
            echo "3) Valved.app       -> Aplicativos (versao standalone)"
            echo ""
            echo "Se o macOS disser que o arquivo nao pode ser aberto, abra o Terminal e rode:"
            echo "xattr -dr com.apple.quarantine /Library/Audio/Plug-Ins/Components/Valved.component /Library/Audio/Plug-Ins/VST3/Valved.vst3 /Applications/Valved.app"
          } > dist/LEIA-ME.txt
          cd dist && ditto -c -k --sequesterRsrc . ../Valved-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Valved-macOS
          path: |
            Valved-macOS.zip
            Valved-macOS-teste.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Compilar o app Valved Cam (Android)
        run: gradle -p android/ValvedCam assembleRelease --no-daemon --stacktrace
      - name: Empacotar
        run: cp android/ValvedCam/app/build/outputs/apk/release/app-release.apk ValvedCam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ValvedCam
          path: ValvedCam.apk

  ios:
    runs-on: macos-15-intel   # Intel: a fila dos Macs arm64 do GitHub está lotada
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Gerar o projeto Xcode (XcodeGen)
        run: |
          brew install xcodegen
          cd ios/ValvedCam && xcodegen generate
      - name: Compilar o app Valved Cam (iPhone, sem assinatura)
        run: |
          xcodebuild -project ios/ValvedCam/ValvedCam.xcodeproj -scheme ValvedCam -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > ios.log 2>&1 \
            || { grep -n "error:" ios.log | head -60; tail -30 ios.log; exit 1; }
          grep -c "warning:" ios.log || true
          test -d build-ios/Build/Products/Release-iphoneos/ValvedCam.app
      - name: Empacotar (.ipa sem assinatura)
        run: |
          mkdir Payload && cp -R build-ios/Build/Products/Release-iphoneos/ValvedCam.app Payload/
          zip -qry ValvedCam-iOS-sem-assinatura.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ValvedCam-iOS
          path: ValvedCam-iOS-sem-assinatura.ipa

  release:
    needs: [windows, android]
    if: always() && needs.windows.result == 'success' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Publicar como release (download direto)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la art
          tag="build-${{ github.ref_name }}"
          gh release delete "$tag" --yes --cleanup-tag -R ${{ github.repository }} 2>/dev/null || true
          files=$(ls art/*.zip art/*.apk 2>/dev/null)
          gh release create "$tag" $files -R ${{ github.repository }} --target ${{ github.sha }} --prerelease \
            --title "Valved ${{ github.ref_name }} (teste)" --notes "Build automatico do ramo ${{ github.ref_name }} (Windows e app Valved Cam para Android)"
